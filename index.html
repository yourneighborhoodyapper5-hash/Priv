<section id="authScreen" class="shell"><div class="auth-card"><div class="brand"><div class="logo">K</div>Kernals</div><p class="sub" id="authIntro">Sign in or create an account to chat.</p><form id="authForm"><div class="field hidden" id="usernameField"><label for="usernameInput">Username</label><input id="usernameInput" maxlength="24" placeholder="Choose a username"></div><div class="field"><label for="emailInput">Email</label><input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="passwordInput">Password</label><input id="passwordInput" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></div><div class="auth-actions"><button class="text-btn" id="modeToggle" type="button">Create an account</button><button class="primary" id="authSubmit" type="submit">Sign in</button></div></form><div id="authStatus" class="status" aria-live="polite"></div></div></section>

nce</option><option value="hue">Color shift</option><option value="orbit">Orbit glow</option></select></div><div id="profileStatus" class="status"></div><div class="dialog-foot"><button class="secondary" id="cancelProfileEdit" type="button">Cancel</button><button class="primary" type="submit">Save profile</button></div></form></div></section></div>

function online(p){const t=p.lastSeen?.toMillis?p.lastSeen.toMillis():0;return p.online===true&&Date.now()-t<90000}function renderMembers(){const root=$('memberPanel');if(!root)return;root.replaceChildren();const all=[...profiles.entries()].map(([uid,p])=>({uid,...p,isOnline:uid===user?.uid||online(p)}));[true,false].forEach(state=>{const group=el('section','presence-group'),list=all.filter(p=>p.isOnline===state);group.append(el('div','member-title',(state?'Online':'Offline')+' — '+list.length));list.sort((a,b)=>(a.username||'').localeCompare(b.username||'')).forEach(p=>{const row=el('button','member-row');row.type='button';const wrap=el('span','presence-avatar');wrap.append(avatar(p.photoURL,p.username,'avatar small',p.animation));wrap.append(el('i','presence-dot'+(p.isOnline?' online':'')));row.append(wrap);const meta=el('span','member-meta');meta.append(el('strong','',p.username||'Member'),el('small','',p.status|| (p.isOnline?'Online':'Offline')));row.append(meta);row.onmouseenter=()=>showHover(p,row);row.onmouseleave=hideHover;row.onfocus=()=>showHover(p,row);row.onblur=hideHover;root.append(group);group.append(row)});if(!list.length)group.append(el('div','presence-empty',state?'Nobody online':'No offline members'));root.append(group)})}
function watchProfiles(){unsubs.profiles?.();unsubs.profiles=onSnapshot(query(collection(db,'profiles'),limit(200)),snap=>{profiles.clear();snap.docs.forEach(d=>profiles.set(d.id,d.data()));renderMembers()},e=>console.warn('Member list listener:',e))}
function showHover(p,target){if(innerWidth<801)return;const card=$('profileHover');card.replaceChildren();const banner=el('div','profile-card-top');if(p.bannerURL)banner.style.backgroundImage=`url("${p.bannerURL.replaceAll('"','%22')}")`;card.append(banner,avatar(p.photoURL,p.username,'avatar',p.animation),el('strong','',p.username||'Member'),el('small','',online(p)?'Online':'Offline'));if(p.about)card.append(el('p','',p.about));const r=target.getBoundingClientRect();card.style.left=Math.max(8,Math.min(innerWidth-275,r.left))+'px';card.style.top=Math.max(8,Math.min(innerHeight-190,r.bottom+6))+'px';card.classList.remove('hidden')}function hideHover(){$('profileHover').classList.add('hidden')}
function renderMessages(items){latestMessages=items;const root=$('messages');root.replaceChildren();if(!items.length){root.append(el('div','empty','No messages yet. Start the conversation.'));return}items.forEach((m,index)=>{const row=el('article','msg'+(!index?' first':'')),authorProfile=profiles.get(m.authorUid)||{username:m.author,photoURL:m.photoURL};const av=el('div','av-col'),pic=avatar(authorProfile.photoURL,authorProfile.username,'avatar',authorProfile.animation);pic.onmouseenter=()=>showHover(authorProfile,pic);pic.onmouseleave=hideHover;av.append(pic);const body=el('div'),head=el('div','mhead'),name=el('button','mname',m.author||'Member');name.type='button';name.onmouseenter=()=>showHover(authorProfile,name);name.onmouseleave=hideHover;const when=m.createdAt?.toDate?m.createdAt.toDate():null,time=el('time','mtime',when?when.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Just now');head.append(name,time);if(m.editedAt)head.append(el('span','mtime','(edited)'));body.append(head);if(m.replyTo){const quote=el('div','reply-quote','Replying to '+m.replyTo.author+': '+m.replyTo.text);body.append(quote)}if(m.text)body.append(el('div','mtext',m.text));if(m.gifURL){const img=el('img','msg-media');img.src=m.gifURL;img.alt=m.gifTitle||'GIF';img.loading='lazy';img.referrerPolicy='no-referrer';body.append(img)}const reactions=el('div','reactions');Object.entries(m.reactions||{}).forEach(([emoji,uids])=>{if(!Array.isArray(uids)||!uids.length)return;const b=el('button','reaction'+(uids.includes(user.uid)?' mine':''),emoji+' '+uids.length);b.type='button';b.onclick=()=>toggleReaction(m.id,emoji);reactions.append(b)});emojiChoices.forEach(emoji=>{if(!(m.reactions||{})[emoji]){const b=el('button','reaction',emoji+' 0');b.type='button';b.onclick=()=>toggleReaction(m.id,emoji);reactions.append(b)}});body.append(reactions);const actions=el('div','msg-actions');const reply=el('button','action-btn','Reply');reply.type='button';reply.onclick=()=>setReply(m);actions.append(reply);if(m.authorUid===user.uid){const edit=el('button','action-btn','Edit');edit.type='button';edit.onclick=()=>beginEdit(m);actions.append(edit)}const more=el('button','action-btn','＋ Reaction');more.type='button';more.onclick=()=>{const emoji=prompt('Enter one emoji to react with:');if(emoji)toggleReaction(m.id,emoji.trim())};actions.append(more);body.append(actions);row.append(av,body);root.append(row)});root.scrollTop=root.scrollHeight}
function setReply(m){replyTarget={id:m.id,author:m.author||'Member',text:(m.text||m.gifTitle||'GIF').slice(0,160)};editingId=null;$('composer').value='';$('replyLabel').textContent='Replying to '+replyTarget.author+': '+replyTarget.text;$('replyingTo').classList.remove('hidden');$('composer').focus()}function clearReply(){replyTarget=null;$('replyingTo').classList.add('hidden')}function beginEdit(m){if(m.authorUid!==user.uid)return;editingId=m.id;replyTarget=null;clearReply();$('composer').value=m.text||'';$('composer').placeholder='Edit your message…';$('sendBtn').textContent='✓';$('composer').focus()}function cancelEdit(){editingId=null;$('composer').value='';$('composer').placeholder='Message '+(active.type==='channel'?'#':'@')+active.name;$('sendBtn').textContent='➤'}
async function saveReaction(messageId,emoji){try{const ref=doc(messageCollection(),messageId);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())return;const reactions={...(snap.data().reactions||{})},users=Array.isArray(reactions[emoji])?[...reactions[emoji]]:[];reactions[emoji]=users.includes(user.uid)?users.filter(x=>x!==user.uid):[...users,user.uid];if(!reactions[emoji].length)delete reactions[emoji];tx.update(ref,{reactions})})}catch(e){status(explain(e),'error')}}function toggleReaction(id,emoji){return saveReaction(id,emoji)}
function setConnection(text){$('connectionStatus').textContent=text}function watchActive(){unsubs.messages?.();unsubs.typing?.();clearTimeout(typingClear);typingRef=null;$('typingIndicator').replaceChildren();$('messages').replaceChildren();setConnection('Connecting…');unsubs.messages=onSnapshot(query(messageCollection(),orderBy('createdAt','asc'),limit(300)),snap=>{setConnection('Connected');renderMessages(snap.docs.map(d=>({id:d.id,...d.data()})))},e=>{console.error(e);setConnection('Database error');status(explain(e),'error')});unsubs.typing=onSnapshot(typingCollection(),snap=>{const names=snap.docs.map(d=>d.data()).filter(x=>x.uid!==user.uid&&x.expiresAt>Date.now()).map(x=>x.username);const target=$('typingIndicator');target.replaceChildren();if(names.length){target.append(document.createTextNode((names.length===1?names[0]+' is':names.join(', ')+' are')+' typing'));const dots=el('span','typing-dots');for(let i=0;i<3;i++)dots.append(el('i'));target.append(dots)}},e=>console.warn('Typing listener:',e));$('titlePrefix').textContent=active.type==='channel'?'#':'@';$('currentName').textContent=active.name;$('composer').placeholder='Message '+(active.type==='channel'?'#':'@')+active.name;renderChannels();renderDMs()}
function selectChannel(name){active={type:'channel',id:name,name};$('layoutRoot').classList.remove('nav-open');cancelEdit();clearReply();watchActive()}function selectDM(id,p){active={type:'dm',id,name:p.username||'Member'};$('layoutRoot').classList.remove('nav-open');cancelEdit();clearReply();watchActive()}
async function updateTyping(){if(!user)return;typingRef=doc(typingCollection(),user.uid);try{await setDoc(typingRef,{uid:user.uid,username:profile.username,expiresAt:Date.now()+6500});clearTimeout(typingClear);typingClear=setTimeout(clearTyping,5000)}catch(e){console.debug(e)}}async function clearTyping(){clearTimeout(typingClear);if(!typingRef)return;const ref=typingRef;typingRef=null;try{await deleteDoc(ref)}catch(e){console.debug(e)}}
async function submitMessage(){const text=$('composer').value.trim();if(sending||!user||(!text&&!editingId))return;sending=true;$('sendBtn').disabled=true;try{if(editingId){await updateDoc(doc(messageCollection(),editingId),{text,editedAt:serverTimestamp()});cancelEdit()}else{const data={author:profile.username,authorUid:user.uid,photoURL:profile.photoURL||'',text,reactions:{},createdAt:serverTimestamp()};if(replyTarget)data.replyTo=replyTarget;await addDoc(messageCollection(),data);$('composer').value='';$('composer').style.height='40px';clearReply()}await clearTyping();status('')}catch(e){console.error(e);status('Could not save message: '+explain(e),'error')}finally{sending=false;$('sendBtn').disabled=false}}
async function ensureProfile(u){const ref=doc(db,'profiles',u.uid),snap=await getDoc(ref);if(snap.exists())return snap.data();const base=(u.email?.split('@')[0]||'member').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,16)||'member',username=base+'-'+u.uid.slice(0,5).toLowerCase(),p={username,usernameLower:username,photoURL:'',bannerURL:'',about:'',animation:'none',status:'Online',online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()};await setDoc(ref,p);await setDoc(doc(db,'usernames',username),{uid:u.uid});return p}
function updateOwnProfileView(){ $('sidebarName').textContent=profile.username;$('sidebarAvatar').replaceChildren(avatar(profile.photoURL,profile.username,'avatar small',profile.animation));$('profileModalAvatar').replaceChildren(avatar(profile.photoURL,profile.username,'avatar',profile.animation));$('profileModalName').textContent=profile.username;$('profileModalEmail').textContent=user.email||'';$('profileViewUsername').textContent='@'+profile.username;$('profileViewAbout').textContent=profile.about||'No about me set.';$('profileViewAnimation').textContent=profile.animation||'none';const wrap=$('profileBannerWrap');wrap.replaceChildren();if(profile.bannerURL){const banner=el('img','profile-banner');banner.src=profile.bannerURL;banner.alt='Profile banner';wrap.append(banner)}}
async function heartbeat(){if(!user)return;try{await setDoc(doc(db,'profiles',user.uid),{online:true,lastSeen:serverTimestamp()},{merge:true})}catch(e){console.debug('Presence heartbeat failed',e)}}function enterApp(){ $('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');updateOwnProfileView();watchProfiles();watchDMs();selectChannel('general');heartbeat();clearInterval(window.__kernalsPresence);window.__kernalsPresence=setInterval(heartbeat,30000)}
function watchDMs(){unsubs.dms?.();unsubs.dms=onSnapshot(query(collection(db,'conversations'),where('members','array-contains',user.uid)),async snap=>{const found=await Promise.all(snap.docs.map(async d=>{const other=(d.data().members||[]).find(x=>x!==user.uid);if(!other)return null;const p=await getDoc(doc(db,'profiles',other));return{id:d.id,profile:p.exists()?p.data():{username:'Member'}}}));dms=found.filter(Boolean).sort((a,b)=>a.profile.username.localeCompare(b.profile.username));renderDMs()},e=>status(explain(e),'error'))}
async function startDM(){const typed=prompt('Enter the exact username to message:');if(!typed)return;const username=typed.trim().replace(/^@/,'').toLowerCase();try{const handle=await getDoc(doc(db,'usernames',username));if(!handle.exists())throw Error('No account found with that username.');const other=handle.data().uid;if(other===user.uid)throw Error('You cannot DM yourself.');const members=[user.uid,other].sort(),id=members.join('_'),ref=doc(db,'conversations',id);if(!(await getDoc(ref)).exists())await setDoc(ref,{members,createdAt:serverTimestamp()});const ps=await getDoc(doc(db,'profiles',other));selectDM(id,ps.exists()?ps.data():{username})}catch(e){status(explain(e),'error')}}
function openProfile(){if(!profile)return;updateOwnProfileView();$('profileView').classList.remove('hidden');$('profileEditForm').classList.add('hidden');$('profileTitle').textContent='Profile';$('profileModal').classList.remove('hidden')}function beginProfileEdit(){$('profileView').classList.add('hidden');$('profileEditForm').classList.remove('hidden');$('profileTitle').textContent='Edit Profile';$('profileUsername').value=profile.username;$('profilePhoto').value=profile.photoURL||'';$('profileBanner').value=profile.bannerURL||'';$('profileAbout').value=profile.about||'';$('profileAnimation').value=animations.includes(profile.animation)?profile.animation:'none';profileStatus('')}
$('profileEditButton').onclick=beginProfileEdit;$('profileButton').onclick=openProfile;$('cancelProfileEdit').onclick=()=>{$('profileEditForm').classList.add('hidden');$('profileView').classList.remove('hidden');$('profileTitle').textContent='Profile'};
$('profileEditForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('profileUsername').value.trim().replace(/^@/,'').toLowerCase(),photoRaw=$('profilePhoto').value.trim(),bannerRaw=$('profileBanner').value.trim(),photoURL=photoRaw?safeURL(photoRaw):'',bannerURL=bannerRaw?safeURL(bannerRaw):'',about=$('profileAbout').value.trim().slice(0,160),animation=$('profileAnimation').value;if(!/^[a-z0-9_-]{3,24}$/.test(username)){profileStatus('Username must be 3–24 letters, numbers, _ or -.','error');return}if((photoRaw&&!photoURL)||(bannerRaw&&!bannerURL)){profileStatus('Image URLs must use http or https.','error');return}try{await runTransaction(db,async tx=>{const nr=doc(db,'usernames',username),existing=await tx.get(nr);if(existing.exists()&&existing.data().uid!==user.uid)throw Error('That username is already taken.');if(username!==profile.usernameLower){tx.set(nr,{uid:user.uid});tx.delete(doc(db,'usernames',profile.usernameLower))}tx.set(doc(db,'profiles',user.uid),{username,usernameLower:username,photoURL,bannerURL,about,animation,updatedAt:serverTimestamp()},{merge:true})});profile={...profile,username,usernameLower:username,photoURL,bannerURL,about,animation};await updateProfile(user,{displayName:username,photoURL:photoURL||null});updateOwnProfileView();renderMembers();watchActive();$('profileEditForm').classList.add('hidden');$('profileView').classList.remove('hidden');$('profileTitle').textContent='Profile'}catch(e){profileStatus(explain(e),'error')}});
function openGif(mode){gifMode=mode;$('gifModal').classList.remove('hidden');$('gifSearchInput').value='';$('gifGrid').replaceChildren();$('gifError').textContent='';$('gifSearchInput').focus()}async function searchGifs(term){const grid=$('gifGrid');grid.replaceChildren();$('gifError').textContent='Searching Wikimedia Commons…';try{const u=new URL('https://commons.wikimedia.org/w/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:term+' filetype:bitmap',gsrnamespace:'6',gsrlimit:'30',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'240',format:'json',origin:'*'});const res=await fetch(u);if(!res.ok)throw Error('Search request failed');const data=await res.json(),pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]&&(p.imageinfo[0].mime==='image/gif'||/\.gif$/i.test(p.title||'')));$('gifError').textContent=pages.length?'':'No GIFs found. Try another search.';pages.forEach(p=>{const info=p.imageinfo[0],src=info.thumburl||info.url,b=el('button','gif-card');b.type='button';const img=el('img');img.src=src;img.alt=p.title;img.loading='lazy';b.append(img);b.onclick=()=>chooseGif(info.url||src,p.title);grid.append(b)})}catch(e){$('gifError').textContent='Wikimedia search failed: '+e.message}}function chooseGif(url,title){$('gifModal').classList.add('hidden');if(gifMode==='profile'){$('profilePhoto').value=url;$('profileModal').classList.remove('hidden');$('profileEditForm').classList.remove('hidden');$('profileView').classList.add('hidden');$('profileTitle').textContent='Edit Profile'}else{const input=$('composer');input.value+=(input.value?' ':'')+url;input.focus()}}
$('browseProfileGif').onclick=()=>openGif('profile');$('gifButton').onclick=()=>openGif('message');$('gifSearchForm').addEventListener('submit',e=>{e.preventDefault();const term=$('gifSearchInput').value.trim();if(term)searchGifs(term)});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'))});
$('modeToggle').onclick=()=>{signup=!signup;$('usernameField').classList.toggle('hidden',!signup);$('authSubmit').textContent=signup?'Create account':'Sign in';$('modeToggle').textContent=signup?'I already have an account':'Create an account';$('authIntro').textContent=signup?'Create an account to join Kernals.':'Sign in to your account.';status('')};$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authSubmit').disabled=true;status(signup?'Creating account…':'Signing in…');try{if(signup){const username=$('usernameInput').value.trim().toLowerCase();if(!/^[a-z0-9_-]{3,24}$/.test(username))throw Error('Username must be 3–24 letters, numbers, _ or -.');const credential=await createUserWithEmailAndPassword(auth,$('emailInput').value.trim(),$('passwordInput').value);await runTransaction(db,async tx=>{const nr=doc(db,'usernames',username),existing=await tx.get(nr);if(existing.exists())throw Error('That username is already taken.');tx.set(nr,{uid:credential.user.uid});tx.set(doc(db,'profiles',credential.user.uid),{username,usernameLower:username,photoURL:'',bannerURL:'',about:'',animation:'none',status:'Online',online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()})})}else await signInWithEmailAndPassword(auth,$('emailInput').value.trim(),$('passwordInput').value)}catch(e){console.error(e);status(explain(e),'error')}finally{$('authSubmit').disabled=false}});
onAuthStateChanged(auth,async u=>{if(!u){user=null;profile=null;Object.values(unsubs).forEach(fn=>fn?.());clearInterval(window.__kernalsPresence);$('appScreen').classList.add('hidden');$('authScreen').classList.remove('hidden');return}user=u;try{profile=await ensureProfile(u);enterApp()}catch(e){console.error(e);status('Could not load profile: '+explain(e),'error')}});
$('newDmBtn').onclick=startDM;$('newChannelBtn').onclick=()=>{let name=prompt('New channel name:');if(!name)return;name=name.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,40);if(name&&!channelNames.includes(name))channelNames.push(name);if(name)selectChannel(name)};$('logoutBtn').onclick=async()=>{await clearTyping();if(user)try{await setDoc(doc(db,'profiles',user.uid),{online:false,lastSeen:serverTimestamp()},{merge:true})}catch{}await signOut(auth)};$('sendBtn').onclick=submitMessage;$('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitMessage()}});$('composer').addEventListener('input',()=>{const c=$('composer');c.style.height='auto';c.style.height=Math.min(c.scrollHeight,140)+'px';if(!c.value.trim()){clearTyping();return}clearTimeout(typingTimer);typingTimer=setTimeout(updateTyping,300)});$('composer').addEventListener('blur',clearTyping);$('cancelReply').onclick=clearReply;$('navToggle').onclick=()=>$('layoutRoot').classList.toggle('nav-open');$('memberToggle').onclick=()=>{const panel=$('memberPanel'),layout=$('layoutRoot');if(innerWidth<=1000)panel.classList.toggle('open');else layout.classList.toggle('members-hidden')};
