function renderMessages(items){lastSnapshot=items;let root=$('messages');root.replaceChildren();if(!items.length){let e=document.createElement('div');e.className='empty';e.textContent='No messages yet. Start the conversation.';root.append(e);return}items.forEach((m,index)=>{let row=document.createElement('article');row.className='msg'+(!index?' first':'');let av=document.createElement('div');av.className='av-col';let authorProfile=profiles.get(m.authorUid)||{username:m.author,photoURL:m.photoURL};let avatarBtn=avatar(authorProfile.photoURL,authorProfile.username);avatarBtn.addEventListener('mouseenter',e=>showHover(authorProfile,avatarBtn));avatarBtn.addEventListener('mouseleave',hideHover);av.append(avatarBtn);let body=document.createElement('div'),head=document.createElement('div');head.className='mhead';let name=document.createElement('button');name.type='button';name.className='mname';name.textContent=m.author||'Member';name.addEventListener('mouseenter',e=>showHover(authorProfile,name));name.addEventListener('mouseleave',hideHover);name.addEventListener('focus',()=>showHover(authorProfile,name));name.addEventListener('blur',hideHover);let time=document.createElement('time');time.className='mtime';let date=m.createdAt?.toDate?m.createdAt.toDate():null;time.textContent=date?date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Just now';head.append(name,time);body.append(head);if(m.text){let t=document.createElement('div');t.className='mtext';t.textContent=m.text;body.append(t)}if(m.gifURL){let img=document.createElement('img');img.className='msg-media';img.src=m.gifURL;img.alt=m.gifTitle||'GIF';img.loading='lazy';img.referrerPolicy='no-referrer';body.append(img)}let reactions=document.createElement('div');reactions.className='reactions';let map=m.reactions||{};emojiSet.forEach(emoji=>{let users=Array.isArray(map[emoji])?map[emoji]:[];let b=document.createElement('button');b.type='button';b.className='reaction'+(users.includes(user.uid)?' mine':'');b.textContent=emoji+' '+users.length;b.title=users.length?users.length+' reaction(s)':'React';b.onclick=()=>toggleReaction(m.id,emoji);reactions.append(b)});let add=document.createElement('button');add.type='button';add.className='reaction';add.textContent='＋';add.title='Add reaction';add.onclick=()=>{let pick=prompt('Choose an emoji: 👍 ❤️ 😂 🎉');if(pick)toggleReaction(m.id,pick.trim())};reactions.append(add);body.append(reactions);row.append(av,body);root.append(row)});root.scrollTop=root.scrollHeight}
function showHover(p,target){let card=$('profileHover');card.replaceChildren();let banner=document.createElement('div');banner.className='profile-card-top';card.append(banner,avatar(p.photoURL,p.username));let name=document.createElement('strong');name.textContent=p.username||'Member';let online=document.createElement('small');online.textContent=isOnline(p)?'Online':'Offline';card.append(name,online);if(p.about){let about=document.createElement('p');about.textContent=p.about;card.append(about)}card.classList.remove('hidden');let r=target.getBoundingClientRect();card.style.left=Math.max(8,Math.min(innerWidth-268,r.left))+'px';card.style.top=Math.max(8,Math.min(innerHeight-190,r.bottom+6))+'px'}function hideHover(){$('profileHover').classList.add('hidden')}
async function toggleReaction(messageId,emoji){try{let ref=doc(messagesCol(),messageId);await runTransaction(db,async tx=>{let snap=await tx.get(ref);if(!snap.exists())return;let reactions={...(snap.data().reactions||{})},users=Array.isArray(reactions[emoji])?[...reactions[emoji]]:[];reactions[emoji]=users.includes(user.uid)?users.filter(uid=>uid!==user.uid):[...users,user.uid];if(!reactions[emoji].length)delete reactions[emoji];tx.update(ref,{reactions})})}catch(e){status('Could not save reaction: '+err(e),'error')}}
function watchActive(){unsubs.messages?.();unsubs.typing?.();clearTimeout(typingClear);typingRef=null;$('typingIndicator').replaceChildren();$('messages').replaceChildren();setConn('Connecting…');unsubs.messages=onSnapshot(query(messagesCol(),orderBy('createdAt','asc'),limit(300)),s=>{setConn('Connected');renderMessages(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{console.error(e);setConn('Database error');status(err(e),'error')});unsubs.typing=onSnapshot(typingCol(),s=>{let names=s.docs.map(d=>d.data()).filter(x=>x.uid!==user.uid&&x.expiresAt>Date.now()).map(x=>x.username);let el=$('typingIndicator');el.replaceChildren();if(names.length){el.append(document.createTextNode((names.length===1?names[0]+' is':names.join(', ')+' are')+' typing'));let dots=document.createElement('span');dots.className='typing-dots';for(let i=0;i<3;i++)dots.append(document.createElement('i'));el.append(dots)}},console.error);$('titlePrefix').textContent=active.type==='channel'?'#':'@';$('currentName').textContent=active.name;$('composer').placeholder='Message '+(active.type==='channel'?'#':'@')+active.name;renderChannels();renderDMs()}
function selectChannel(name){active={type:'channel',id:name,name};$('layoutRoot').classList.remove('nav-open');watchActive()}function selectDM(id,p){active={type:'dm',id,name:p.username||'Member'};$('layoutRoot').classList.remove('nav-open');watchActive()}
async function writeTyping(){if(!user)return;typingRef=doc(typingCol(),user.uid);try{await setDoc(typingRef,{uid:user.uid,username:profile.username,expiresAt:Date.now()+6500});clearTimeout(typingClear);typingClear=setTimeout(clearTyping,5000)}catch(e){console.debug(e)}}async function clearTyping(){clearTimeout(typingClear);if(!typingRef)return;let ref=typingRef;typingRef=null;try{await deleteDoc(ref)}catch(e){console.debug(e)}}
async function sendMessage(text=$('composer').value.trim(),gifURL='',gifTitle=''){if((!text&&!gifURL)||sending)return;sending=true;$('sendBtn').disabled=true;try{await addDoc(messagesCol(),{author:profile.username,authorUid:user.uid,photoURL:profile.photoURL||'',text,gifURL,gifTitle,reactions:{},createdAt:serverTimestamp()});$('composer').value='';$('composer').style.height='40px';await clearTyping();status('')}catch(e){console.error(e);status('Message not sent: '+err(e),'error')}finally{sending=false;$('sendBtn').disabled=false}}
async function ensureProfile(u){let ref=doc(db,'profiles',u.uid),snap=await getDoc(ref);if(snap.exists())return snap.data();let name=((u.email||'member').split('@')[0].toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,16)||'member')+'-'+u.uid.slice(0,5).toLowerCase();let p={username:name,usernameLower:name,photoURL:'',online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()};await setDoc(ref,p);await setDoc(doc(db,'usernames',name),{uid:u.uid});return p}
async function heartbeat(){if(!user)return;try{await setDoc(doc(db,'profiles',user.uid),{online:true,lastSeen:serverTimestamp()},{merge:true})}catch(e){console.debug('Presence heartbeat failed',e)}}function enterApp(){ $('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('sidebarName').textContent=profile.username;$('sidebarAvatar').replaceChildren(avatar(profile.photoURL,profile.username,'avatar small'));watchProfiles();watchDMs();selectChannel('general');heartbeat();clearInterval(window.__presenceTimer);window.__presenceTimer=setInterval(heartbeat,30000)}
function watchDMs(){unsubs.dms?.();unsubs.dms=onSnapshot(query(collection(db,'conversations'),where('members','array-contains',user.uid)),async snap=>{let items=await Promise.all(snap.docs.map(async d=>{let other=(d.data().members||[]).find(x=>x!==user.uid);if(!other)return null;let p=await getDoc(doc(db,'profiles',other));return{id:d.id,profile:p.exists()?p.data():{username:'Member'}}}));dms=items.filter(Boolean).sort((a,b)=>a.profile.username.localeCompare(b.profile.username));renderDMs()},e=>status(err(e),'error'))}
async function startDM(){let name=prompt('Enter the exact username to message:');if(!name)return;name=name.trim().replace(/^@/,'').toLowerCase();try{let handle=await getDoc(doc(db,'usernames',name));if(!handle.exists()){status('No account found with that username.','error');return}let other=handle.data().uid;if(other===user.uid){status('You cannot DM yourself.','error');return}let members=[user.uid,other].sort(),id=members.join('_'),ref=doc(db,'conversations',id);if(!(await getDoc(ref)).exists())await setDoc(ref,{members,createdAt:serverTimestamp()});let p=await getDoc(doc(db,'profiles',other));selectDM(id,p.exists()?p.data():{username:name})}catch(e){status(err(e),'error')}}
function editProfile(){ $('profileView').classList.add('hidden');$('profileEditForm').classList.remove('hidden');$('profileTitle').textContent='Edit Profile';$('profileUsername').value=profile.username;$('profilePhoto').value=profile.photoURL||'';profileStatus('')}$('editProfileButton').onclick=editProfile;$('profileButton').onclick=showProfile;$('cancelProfileEdit').onclick=()=>{$('profileEditForm').classList.add('hidden');$('profileView').classList.remove('hidden');$('profileTitle').textContent='Profile'};
$('profileEditForm').addEventListener('submit',async e=>{e.preventDefault();let username=$('profileUsername').value.trim().replace(/^@/,'').toLowerCase(),raw=$('profilePhoto').value.trim(),photoURL=raw?validUrl(raw):'';if(!/^[a-z0-9_-]{3,24}$/.test(username)){profileStatus('Username must be 3–24 letters, numbers, _ or -.','error');return}if(raw&&!photoURL){profileStatus('Enter a valid http or https image URL.','error');return}try{await runTransaction(db,async t=>{let nr=doc(db,'usernames',username),existing=await t.get(nr);if(existing.exists()&&existing.data().uid!==user.uid)throw Error('That username is already taken.');if(username!==profile.usernameLower){t.set(nr,{uid:user.uid});t.delete(doc(db,'usernames',profile.usernameLower))}t.set(doc(db,'profiles',user.uid),{username,usernameLower:username,photoURL,updatedAt:serverTimestamp()},{merge:true})});profile={...profile,username,usernameLower:username,photoURL};await updateProfile(user,{displayName:username,photoURL:photoURL||null});$('sidebarName').textContent=username;$('sidebarAvatar').replaceChildren(avatar(photoURL,username,'avatar small'));showProfile()}catch(e){profileStatus(e.message||err(e),'error')}});
function openGif(mode){gifMode=mode;$('gifModal').classList.remove('hidden');$('gifSearchInput').value='';$('gifGrid').replaceChildren();$('gifError').textContent='';$('gifSearchInput').focus()}async function searchGifs(term){let grid=$('gifGrid');grid.replaceChildren();$('gifError').textContent='Searching Wikimedia Commons…';try{let u=new URL('https://commons.wikimedia.org/w/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:`${term} filetype:bitmap`,gsrnamespace:'6',gsrlimit:'30',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'240',format:'json',origin:'*'});let res=await fetch(u);if(!res.ok)throw Error('Search request failed');let data=await res.json(),pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]&&(p.imageinfo[0].mime==='image/gif'||/\.gif$/i.test(p.title||'')));$('gifError').textContent=pages.length?'':'No GIFs found. Try a different search.';pages.forEach(p=>{let info=p.imageinfo[0],src=info.thumburl||info.url,b=document.createElement('button');b.type='button';b.className='gif-card';let img=document.createElement('img');img.src=src;img.alt=p.title;img.loading='lazy';b.append(img);b.onclick=()=>chooseGif(info.url||src,p.title);grid.append(b)})}catch(e){$('gifError').textContent='Wikimedia search failed: '+e.message}}function chooseGif(url,title){$('gifModal').classList.add('hidden');if(gifMode==='profile'){$('profilePhoto').value=url;$('profileModal').classList.remove('hidden');$('profileEditForm').classList.remove('hidden');$('profileView').classList.add('hidden');$('profileTitle').textContent='Edit Profile'}else sendMessage('',url,title)}
$('browseProfileGif').onclick=()=>openGif('profile');$('gifButton').onclick=()=>openGif('message');$('gifSearchForm').addEventListener('submit',e=>{e.preventDefault();let term=$('gifSearchInput').value.trim();if(term)searchGifs(term)});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'))});
$('modeToggle').onclick=()=>{signup=!signup;$('usernameField').classList.toggle('hidden',!signup);$('authSubmit').textContent=signup?'Create account':'Sign in';$('modeToggle').textContent=signup?'I already have an account':'Create an account';$('authIntro').textContent=signup?'Create an account to join Kernals.':'Sign in to your account.';status('')};$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authSubmit').disabled=true;try{if(signup){let name=$('usernameInput').value.trim().toLowerCase();if(!/^[a-z0-9_-]{3,24}$/.test(name))throw Error('Username must be 3–24 letters, numbers, _ or -.');let cred=await createUserWithEmailAndPassword(auth,$('emailInput').value.trim(),$('passwordInput').value);await runTransaction(db,async t=>{let nr=doc(db,'usernames',name),existing=await t.get(nr);if(existing.exists())throw Error('That username is already taken.');t.set(nr,{uid:cred.user.uid});t.set(doc(db,'profiles',cred.user.uid),{username:name,usernameLower:name,photoURL:'',online:true,lastSeen:serverTimestamp(),createdAt:serverTimestamp()})})}else await signInWithEmailAndPassword(auth,$('emailInput').value.trim(),$('passwordInput').value)}catch(e){status(err(e),'error')}finally{$('authSubmit').disabled=false}});
onAuthStateChanged(auth,async u=>{if(!u){user=null;profile=null;Object.values(unsubs).forEach(f=>f?.());clearInterval(window.__presenceTimer);$('appScreen').classList.add('hidden');$('authScreen').classList.remove('hidden');return}user=u;try{profile=await ensureProfile(u);enterApp()}catch(e){console.error(e);status('Could not load profile: '+err(e),'error')}});
$('newDmBtn').onclick=startDM;$('newChannelBtn').onclick=()=>{let n=prompt('New channel name:');if(!n)return;n=n.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,40);if(n&&!channelNames.includes(n))channelNames.push(n);if(n)selectChannel(n)};$('logoutBtn').onclick=async()=>{await clearTyping();if(user)try{await setDoc(doc(db,'profiles',user.uid),{online:false,lastSeen:serverTimestamp()},{merge:true})}catch{}await signOut(auth)};$('sendBtn').onclick=()=>sendMessage();$('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('composer').addEventListener('input',()=>{let c=$('composer');c.style.height='auto';c.style.height=Math.min(c.scrollHeight,140)+'px';if(!c.value.trim()){clearTyping();return}clearTimeout(typingTimer);typingTimer=setTimeout(writeTyping,300)});$('composer').addEventListener('blur',clearTyping);$('navToggle').onclick=()=>$('layoutRoot').classList.toggle('nav-open');$('memberToggle').onclick=()=>{let panel=$('memberPanel'),layout=$('layoutRoot');if(innerWidth<=1000){panel.classList.toggle('open')}else{layout.classList.toggle('members-hidden')}};
</script>
