<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141516">
  <title>Kernals - Chat</title>
  <style>
    :root{color-scheme:dark;--rail:#141516;--side:#1b1c1d;--bg:#202223;--ink:#e4e4e1;--muted:#a0a19c;--line:#2e3031;--hover:#2a2c2d;--accent:#56645b;--accent-hover:#65746a;--danger:#e28c86;--field:#191b1a;--success:#a6c2ad}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100%;display:grid;place-items:center;padding:22px}.auth-card{width:min(420px,100%);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:21px}.logo{width:34px;height:34px;border-radius:6px;background:#3b4540;display:grid;place-items:center;color:#e9eee9;font-weight:700}.sub{color:var(--muted);line-height:1.5;font-size:14px;margin:12px 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:600;color:#c8c9c5}.field input{width:100%;border:1px solid #414442;background:var(--field);color:var(--ink);border-radius:4px;padding:12px 13px;outline:none;font-size:16px}.field input:focus{border-color:#89978e}.primary,.secondary{border:1px solid transparent;border-radius:4px;padding:10px 14px;font-weight:600}.primary{background:var(--accent);color:#fff}.primary:hover:not(:disabled){background:var(--accent-hover)}.secondary{background:#303331;border-color:#414442;color:#e0e1dd}.secondary:hover{background:#383b39}.primary:disabled{opacity:.5;cursor:not-allowed}.sm{padding:7px 10px;font-size:13px}.auth-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.text-btn{background:none;border:0;color:#b6c2b9;padding:7px 0;font-size:12px}.status{min-height:20px;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.45}.status.error{color:var(--danger)}.status.ok{color:var(--success)}
    .app{height:100dvh}.layout{height:100dvh;display:grid;grid-template-columns:auto minmax(0,1fr);overflow:hidden}.nav{display:flex;min-height:0}.rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}.server{width:46px;height:46px;border:0;border-radius:8px;background:#3b4540;color:#e9eee9;font-weight:700;font-size:18px}.channels{width:240px;background:var(--side);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.server-name{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 16px;font-weight:700;border-bottom:1px solid var(--line)}.cat{padding:18px 16px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#9b9d98}.channel,.dm-item{display:flex;align-items:center;gap:8px;margin:1px 8px;padding:7px 8px;border:0;border-radius:4px;background:transparent;color:var(--muted);text-align:left;width:calc(100% - 16px);min-width:0}.channel.active,.dm-item.active{background:#303331;color:var(--ink)}.channel:hover,.dm-item:hover{background:var(--hover);color:var(--ink)}.dm-item{gap:9px}.dm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dm-avatar{width:24px;height:24px;flex:0 0 24px;border-radius:50%;object-fit:cover;background:#4a5a50}.dm-avatar-fallback{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;background:#4a5a50;font-size:11px}.userbar{margin-top:auto;padding:10px;background:#171819;display:flex;align-items:center;gap:8px;min-width:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.who{flex:1;min-width:0;border:0;background:none;display:flex;align-items:center;gap:9px;text-align:left;padding:3px;border-radius:4px}.who:hover,.ub-btn:hover{background:var(--hover)}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:#4a5a50;color:#e6ebe7;font-weight:700;overflow:hidden;object-fit:cover}.nm{min-width:0}.nm strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.ub-btn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px 6px;border-radius:4px}
    .conversation{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}.chat-header{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;padding-top:env(safe-area-inset-top)}.title{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{color:var(--muted);font-weight:400;margin-right:6px}.conn{font-size:12px;color:var(--muted);white-space:nowrap}.conn i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#91c99d;margin-right:6px}.hbtn{border:1px solid var(--line);background:transparent;border-radius:4px;color:var(--muted);padding:6px 10px;font-size:12px}.hbtn:hover{color:var(--ink);background:var(--hover)}#navToggle{display:none}.messages{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px;display:flex;flex-direction:column}.empty{margin:auto;text-align:center;max-width:280px;color:var(--muted);font-size:13px;line-height:1.6;padding:20px}.msg{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:16px;padding:4px 16px}.msg.first{margin-top:14px}.msg:hover{background:#ffffff08}.av-col{display:flex;justify-content:center;align-items:flex-start;padding-top:2px}.msg .avatar{width:40px;height:40px;flex-basis:40px}.mhead{display:flex;align-items:baseline;gap:8px;min-width:0}.mname{font-weight:700;font-size:15px;color:var(--ink);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mtime{font-size:11px;color:var(--muted)}.mtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;font-size:15px;color:var(--ink)}.typing{height:22px;padding:2px 16px;color:var(--muted);font-size:12px}.composer-wrap{padding:0 16px calc(16px + env(safe-area-inset-bottom))}.composer{display:flex;align-items:flex-end;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px}.composer textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;resize:none;padding:10px 6px;font-size:16px;line-height:1.35;max-height:140px;height:40px}.ibtn{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:20px;display:grid;place-items:center}.ibtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}.ibtn:disabled{opacity:.4;cursor:not-allowed}.send{background:var(--accent);color:#fff;font-size:16px}.hint{font-size:11px;color:var(--muted);margin:6px 3px 0}
    @media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}.nav{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .18s}.layout.nav-open .nav{transform:none}#navToggle{display:inline-block}.conn{display:none}.msg{column-gap:12px;padding:4px 12px}.composer-wrap{padding:0 10px calc(10px + env(safe-area-inset-bottom))}.typing{padding-left:12px}.hint{display:none}.auth-card{padding:24px 20px}.shell{padding:14px}}
  </style>
</head>
<body>
  <section id="authScreen" class="shell"><div class="auth-card">
    <div class="brand"><div class="logo">K</div><div>Kernals</div></div><p class="sub" id="authIntro">Sign in or create an account to join the chat.</p>
    <form id="authForm">
      <div class="field hidden" id="usernameField"><label for="usernameInput">Username</label><input id="usernameInput" maxlength="24" autocomplete="username" placeholder="Choose a username"></div>
      <div class="field"><label for="emailInput">Email</label><input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div class="field"><label for="passwordInput">Password</label><input id="passwordInput" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></div>
      <div class="field hidden" id="photoField"><label for="photoInput">Profile picture URL (optional; GIFs supported)</label><input id="photoInput" type="url" placeholder="https://example.com/avatar.gif"></div>
      <div class="auth-actions"><button class="text-btn" id="modeToggle" type="button">Create an account</button><button class="primary" id="authSubmit" type="submit">Sign in</button></div>
    </form><div id="authStatus" class="status" aria-live="polite"></div>
  </div></section>

  <div id="appScreen" class="app hidden"><div class="layout" id="layoutRoot">
    <aside class="nav" aria-label="Chat navigation"><div class="rail"><button class="server" type="button" title="Kernals">K</button></div><div class="channels">
      <div class="server-name">Kernals</div><div class="cat">Channels</div><div id="channelList"></div><div class="cat">Direct Messages</div><div id="dmList"></div>
      <div class="userbar"><button class="who" type="button" id="profileButton" title="Edit profile"><img class="avatar" id="profileAvatar" alt=""><span class="nm"><strong id="profileName">User</strong><small>online</small></span></button><button class="ub-btn" type="button" id="logoutBtn">Logout</button></div>
    </div></aside>
    <main class="conversation"><header class="chat-header"><button class="hbtn" id="navToggle" type="button" aria-label="Toggle navigation">☰</button><div class="title"><span id="titlePrefix">#</span><span id="currentChannelLabel">general</span></div><div class="conn" id="connectionStatus"><i></i>Connecting</div><button class="hbtn" id="newDmBtn" type="button">+ DM</button><button class="hbtn" id="newChannelBtn" type="button">+ Channel</button></header>
      <section id="messages" class="messages" aria-live="polite"></section><div id="typingIndicator" class="typing" aria-live="polite"></div>
      <div class="composer-wrap"><div class="composer"><textarea id="composer" rows="1" maxlength="2000" placeholder="Message #general"></textarea><button class="ibtn send" id="sendBtn" type="button" aria-label="Send message">➤</button></div><div class="hint">Press Enter to send · Shift + Enter for a new line</div></div>
    </main>
  </div></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, doc, getDoc, getDocs, setDoc, where, runTransaction, deleteDoc } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyC8QLXhKJaRHdi_BpC-Sm-A8uc7uhOAQwY',
      authDomain: 'privatechat-b39d3.firebaseapp.com',
      projectId: 'privatechat-b39d3',
      storageBucket: 'privatechat-b39d3.firebasestorage.app',
      messagingSenderId: '1031388982221',
      appId: '1:1031388982221:web:2807b429e387eff320f284',
      measurementId: 'G-VFFT75E2GN'
    };
    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const channelNames = ['general', 'announcements', 'help'];
    const $ = id => document.getElementById(id);
    let currentUser = null;
    let currentProfile = null;
    let active = { type: 'channel', id: 'general', name: 'general' };
    let stopMessages = null, stopTyping = null, stopDMs = null;
    let typingTimer = null, typingClearTimer = null, isTyping = false, sending = false;
    let isSignup = false;
    let knownDMs = [];

    function setStatus(message, kind = '') { $('authStatus').textContent = message; $('authStatus').className = 'status' + (kind ? ' ' + kind : ''); }
    function errorMessage(error) {
      const messages = {
        'auth/email-already-in-use': 'That email already has an account. Sign in instead.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/weak-password': 'Choose a password with at least 6 characters.',
        'auth/invalid-credential': 'Email or password is incorrect.',
        'auth/user-not-found': 'Email or password is incorrect.',
        'auth/wrong-password': 'Email or password is incorrect.',
        'permission-denied': 'Firebase denied access. Check your Firestore security rules.'
      };
      return messages[error.code] || error.message || 'Something went wrong. Please try again.';
    }
    function setConnection(text, ok = false) {
      const el = $('connectionStatus'); el.replaceChildren(); const dot = document.createElement('i');
      dot.style.background = ok ? '#91c99d' : '#e28c86'; el.append(dot, document.createTextNode(text));
    }
    function cleanPhotoUrl(raw) {
      if (!raw) return '';
      try { const url = new URL(raw); return ['https:', 'http:'].includes(url.protocol) ? url.href : ''; }
      catch { return ''; }
    }
    function avatarElement(url, name, className = 'avatar') {
      if (url) { const image = document.createElement('img'); image.className = className; image.src = url; image.alt = ''; image.referrerPolicy = 'no-referrer'; image.onerror = () => { const fallback = document.createElement('span'); fallback.className = className; fallback.textContent = (name || '?').slice(0, 1).toUpperCase(); image.replaceWith(fallback); }; return image; }
      const fallback = document.createElement('span'); fallback.className = className; fallback.textContent = (name || '?').slice(0, 1).toUpperCase(); return fallback;
    }
    function updateProfileUI() {
      $('profileName').textContent = currentProfile?.username || currentUser?.email || 'User';
      $('profileAvatar').replaceWith(avatarElement(currentProfile?.photoURL, currentProfile?.username || 'U'));
      $('profileAvatar').id = 'profileAvatar';
    }
    function getMessageCollection() {
      return active.type === 'channel'
        ? collection(db, 'channels', active.id, 'messages')
        : collection(db, 'conversations', active.id, 'messages');
    }
    function getTypingCollection() {
      return active.type === 'channel'
        ? collection(db, 'channels', active.id, 'typing')
        : collection(db, 'conversations', active.id, 'typing');
    }
    function renderChannels() {
      const root = $('channelList'); root.replaceChildren();
      channelNames.forEach(name => {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'channel' + (active.type === 'channel' && active.id === name ? ' active' : ''); button.textContent = '# ' + name;
        button.addEventListener('click', () => selectChannel(name)); root.appendChild(button);
      });
    }
    function renderDMs() {
      const root = $('dmList'); root.replaceChildren();
      if (!knownDMs.length) { const note = document.createElement('div'); note.style.cssText = 'padding:6px 16px;color:var(--muted);font-size:12px'; note.textContent = 'No DMs yet. Use + DM to start one.'; root.appendChild(note); return; }
      knownDMs.forEach(dm => {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'dm-item' + (active.type === 'dm' && active.id === dm.id ? ' active' : '');
        button.append(avatarElement(dm.profile?.photoURL, dm.profile?.username || '?', 'dm-avatar'));
        const label = document.createElement('span'); label.className = 'dm-name'; label.textContent = dm.profile?.username || 'Member'; button.appendChild(label);
        button.addEventListener('click', () => selectDM(dm.id, dm.profile)); root.appendChild(button);
      });
    }
    function watchDMs() {
      if (stopDMs) stopDMs();
      stopDMs = onSnapshot(query(collection(db, 'conversations'), where('members', 'array-contains', currentUser.uid)), async snapshot => {
        const result = await Promise.all(snapshot.docs.map(async conversation => {
          const otherUid = (conversation.data().members || []).find(uid => uid !== currentUser.uid);
          if (!otherUid) return null;
          const profileSnap = await getDoc(doc(db, 'profiles', otherUid));
          return { id: conversation.id, profile: profileSnap.exists() ? profileSnap.data() : { username: 'Member' } };
        }));
        knownDMs = result.filter(Boolean).sort((a, b) => (a.profile.username || '').localeCompare(b.profile.username || ''));
        renderDMs();
      }, error => { console.error('DM listener error:', error); setStatus(errorMessage(error), 'error'); });
    }
    function renderMessages(items) {
      const root = $('messages'); root.replaceChildren();
      if (!items.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'No messages yet. Start the conversation.'; root.appendChild(empty); return; }
      items.forEach((message, index) => {
        const row = document.createElement('article'); row.className = 'msg' + (index === 0 ? ' first' : '');
        const av = document.createElement('div'); av.className = 'av-col'; av.appendChild(avatarElement(message.photoURL, message.author, 'avatar')); 
        const body = document.createElement('div'); const head = document.createElement('div'); head.className = 'mhead';
        const author = document.createElement('strong'); author.className = 'mname'; author.textContent = message.author || 'Member';
        const time = document.createElement('time'); time.className = 'mtime';
        const date = message.createdAt?.toDate ? message.createdAt.toDate() : (message.createdAt ? new Date(message.createdAt) : null);
        time.textContent = date && !Number.isNaN(date.getTime()) ? date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Just now';
        head.append(author, time); const text = document.createElement('div'); text.className = 'mtext'; text.textContent = message.text || ''; body.append(head, text); row.append(av, body); root.appendChild(row);
      });
      root.scrollTop = root.scrollHeight;
    }
    function subscribeActive() {
      if (stopMessages) stopMessages(); if (stopTyping) stopTyping();
      stopTypingPresence(); $('typingIndicator').textContent = ''; $('messages').replaceChildren(); setConnection('Connecting');
      const messagesQuery = query(getMessageCollection(), orderBy('createdAt', 'asc'), limit(300));
      stopMessages = onSnapshot(messagesQuery, snapshot => {
        setConnection('Connected', true);
        renderMessages(snapshot.docs.map(item => ({ id: item.id, ...item.data() })));
      }, error => { console.error('Message listener error:', error); setConnection('Database error'); setStatus(errorMessage(error), 'error'); });
      stopTyping = onSnapshot(getTypingCollection(), snapshot => {
        const names = snapshot.docs.map(item => item.data()).filter(data => data.uid !== currentUser.uid && data.expiresAt > Date.now()).map(data => data.username || 'Someone');
        $('typingIndicator').textContent = names.length ? (names.length === 1 ? names[0] + ' is typing…' : names.join(', ') + ' are typing…') : '';
      }, error => console.error('Typing listener error:', error));
      $('titlePrefix').textContent = active.type === 'channel' ? '#' : '@';
      $('currentChannelLabel').textContent = active.name;
      $('composer').placeholder = 'Message ' + (active.type === 'channel' ? '#' : '@') + active.name;
      renderChannels(); renderDMs();
    }
    function selectChannel(name) {
      active = { type: 'channel', id: name, name };
      layoutRoot.classList.remove('nav-open'); subscribeActive();
    }
    function selectDM(id, profile) {
      active = { type: 'dm', id, name: profile?.username || 'Member' };
      layoutRoot.classList.remove('nav-open'); subscribeActive();
    }
    async function setTypingPresence() {
      if (!currentUser || !active) return;
      const presenceRef = doc(getTypingCollection(), currentUser.uid);
      try {
        await setDoc(presenceRef, { uid: currentUser.uid, username: currentProfile.username, expiresAt: Date.now() + 7000 });
        isTyping = true;
        clearTimeout(typingClearTimer);
        typingClearTimer = setTimeout(stopTypingPresence, 5000);
      } catch (error) { console.error('Could not update typing status:', error); }
    }
    async function stopTypingPresence() {
      clearTimeout(typingClearTimer);
      if (!isTyping || !currentUser || !active) return;
      isTyping = false;
      try { await deleteDoc(doc(getTypingCollection(), currentUser.uid)); } catch (error) { console.debug('Typing cleanup:', error); }
    }
    async function sendMessage() {
      const text = $('composer').value.trim(); if (!text || sending || !currentUser) return;
      sending = true; $('sendBtn').disabled = true;
      try {
        await addDoc(getMessageCollection(), { author: currentProfile.username, authorUid: currentUser.uid, photoURL: currentProfile.photoURL || '', text, createdAt: serverTimestamp() });
        $('composer').value = ''; $('composer').style.height = '40px'; setStatus('', ''); await stopTypingPresence(); $('composer').focus();
      } catch (error) { console.error('Message send failed:', error); setStatus('Message not sent: ' + errorMessage(error), 'error'); }
      finally { sending = false; $('sendBtn').disabled = false; }
    }
    async function ensureProfile(user) {
      const profileRef = doc(db, 'profiles', user.uid); const profileSnap = await getDoc(profileRef);
      if (profileSnap.exists()) return profileSnap.data();
      const base = (user.email?.split('@')[0] || 'member').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 18) || 'member';
      const candidate = base + '-' + user.uid.slice(0, 5).toLowerCase();
      const profile = { username: candidate, usernameLower: candidate, photoURL: user.photoURL || '', createdAt: serverTimestamp() };
      await setDoc(profileRef, profile);
      await setDoc(doc(db, 'usernames', candidate), { uid: user.uid });
      return profile;
    }
    async function startDM() {
      const typed = window.prompt('Enter the exact username to message (without @):');
      if (!typed) return;
      const username = typed.trim().replace(/^@/, '').toLowerCase();
      if (!username) return;
      if (username === currentProfile.usernameLower) { setStatus('You cannot start a DM with yourself.', 'error'); return; }
      try {
        const handle = await getDoc(doc(db, 'usernames', username));
        if (!handle.exists()) { setStatus('No user found with that username.', 'error'); return; }
        const otherUid = handle.data().uid;
        const members = [currentUser.uid, otherUid].sort();
        const conversationId = members.join('_');
        const conversationRef = doc(db, 'conversations', conversationId);
        if (!(await getDoc(conversationRef)).exists()) await setDoc(conversationRef, { members, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        const profileSnap = await getDoc(doc(db, 'profiles', otherUid));
        const profile = profileSnap.exists() ? profileSnap.data() : { username };
        selectDM(conversationId, profile); setStatus('', '');
      } catch (error) { console.error('Could not start DM:', error); setStatus('Could not start DM: ' + errorMessage(error), 'error'); }
    }
    async function editProfile() {
      if (!currentUser || !currentProfile) return;
      const name = window.prompt('Username (letters, numbers, _ or -):', currentProfile.username);
      if (name === null) return;
      const username = name.trim().replace(/^@/, '').toLowerCase();
      if (!/^[a-z0-9_-]{3,24}$/.test(username)) { setStatus('Username must be 3–24 letters, numbers, underscores, or hyphens.', 'error'); return; }
      const photo = window.prompt('Profile picture URL (GIF, JPG, PNG, or other image URL). Leave blank to remove:', currentProfile.photoURL || '');
      if (photo === null) return;
      const photoURL = cleanPhotoUrl(photo.trim());
      if (photo.trim() && !photoURL) { setStatus('Picture URL must be a valid http or https URL.', 'error'); return; }
      try {
        await runTransaction(db, async transaction => {
          const newHandleRef = doc(db, 'usernames', username);
          const newHandle = await transaction.get(newHandleRef);
          if (newHandle.exists() && newHandle.data().uid !== currentUser.uid) throw new Error('That username is already taken.');
          if (username !== currentProfile.usernameLower) {
            transaction.set(newHandleRef, { uid: currentUser.uid });
            transaction.delete(doc(db, 'usernames', currentProfile.usernameLower));
          }
          transaction.set(doc(db, 'profiles', currentUser.uid), { username, usernameLower: username, photoURL, updatedAt: serverTimestamp() }, { merge: true });
        });
        currentProfile = { ...currentProfile, username, usernameLower: username, photoURL };
        await updateProfile(currentUser, { displayName: username, photoURL: photoURL || null });
        updateProfileUI(); subscribeActive(); setStatus('Profile updated.', 'ok');
      } catch (error) { setStatus(error.message || errorMessage(error), 'error'); }
    }
    function setAuthMode(signup) {
      isSignup = signup;
      $('usernameField').classList.toggle('hidden', !signup);
      $('photoField').classList.toggle('hidden', !signup);
      $('authSubmit').textContent = signup ? 'Create account' : 'Sign in';
      $('modeToggle').textContent = signup ? 'I already have an account' : 'Create an account';
      $('authIntro').textContent = signup ? 'Create your account to join Kernals chat.' : 'Sign in to your Kernals account.';
      $('passwordInput').autocomplete = signup ? 'new-password' : 'current-password';
      setStatus('');
    }

    $('modeToggle').addEventListener('click', () => setAuthMode(!isSignup));
    $('authForm').addEventListener('submit', async event => {
      event.preventDefault(); const email = $('emailInput').value.trim(); const password = $('passwordInput').value;
      $('authSubmit').disabled = true; setStatus(isSignup ? 'Creating account…' : 'Signing in…');
      try {
        if (isSignup) {
          const username = $('usernameInput').value.trim().replace(/^@/, '').toLowerCase();
          if (!/^[a-z0-9_-]{3,24}$/.test(username)) throw new Error('Username must be 3–24 letters, numbers, underscores, or hyphens.');
          const photoURL = cleanPhotoUrl($('photoInput').value.trim());
          if ($('photoInput').value.trim() && !photoURL) throw new Error('Picture URL must be a valid http or https URL.');
          const credential = await createUserWithEmailAndPassword(auth, email, password);
          await runTransaction(db, async transaction => {
            const handleRef = doc(db, 'usernames', username); const existing = await transaction.get(handleRef);
            if (existing.exists()) throw new Error('That username is already taken.');
            transaction.set(handleRef, { uid: credential.user.uid });
            transaction.set(doc(db, 'profiles', credential.user.uid), { username, usernameLower: username, photoURL, createdAt: serverTimestamp() });
          });
          await updateProfile(credential.user, { displayName: username, photoURL: photoURL || null });
          currentUser = credential.user; currentProfile = { username, usernameLower: username, photoURL }; enterApp();
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) { console.error('Authentication error:', error); setStatus(errorMessage(error), 'error'); }
      finally { $('authSubmit').disabled = false; }
    });
    function enterApp() {
      $('authScreen').classList.add('hidden'); $('appScreen').classList.remove('hidden');
      updateProfileUI(); watchDMs(); renderChannels(); selectChannel('general'); setStatus('');
    }
    onAuthStateChanged(auth, async user => {
      if (!user) {
        currentUser = null; currentProfile = null;
        if (stopMessages) stopMessages(); if (stopTyping) stopTyping(); if (stopDMs) stopDMs();
        $('appScreen').classList.add('hidden'); $('authScreen').classList.remove('hidden'); return;
      }
      currentUser = user;
      try { currentProfile = await ensureProfile(user); enterApp(); }
      catch (error) { console.error('Could not load profile:', error); setStatus('Could not load your profile: ' + errorMessage(error), 'error'); }
    });
    $('logoutBtn').addEventListener('click', async () => { await stopTypingPresence(); try { await signOut(auth); } catch (error) { setStatus(errorMessage(error), 'error'); } });
    $('profileButton').addEventListener('click', editProfile);
    $('newDmBtn').addEventListener('click', startDM);
    $('newChannelBtn').addEventListener('click', () => {
      const raw = window.prompt('New channel name:'); if (!raw) return;
      const name = raw.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
      if (!name) return; if (!channelNames.includes(name)) channelNames.push(name); selectChannel(name);
    });
    $('sendBtn').addEventListener('click', sendMessage);
    $('composer').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
    $('composer').addEventListener('input', () => {
      const input = $('composer'); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      if (!input.value.trim()) { stopTypingPresence(); return; }
      clearTimeout(typingTimer); typingTimer = setTimeout(setTypingPresence, 350);
    });
    $('composer').addEventListener('blur', stopTypingPresence);
    $('navToggle').addEventListener('click', () => $('layoutRoot').classList.toggle('nav-open'));
    window.addEventListener('click', event => { if (innerWidth <= 800 && $('layoutRoot').classList.contains('nav-open') && !event.target.closest('.nav') && !event.target.closest('#navToggle')) $('layoutRoot').classList.remove('nav-open'); });
  </script>
</body>
</html>
