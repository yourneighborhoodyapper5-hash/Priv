<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141516">
  <title>Kernals — Chat</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Keep the sign-in/sign-up switch working even if Firebase or app.js fails to load.
    window.kernalsSetAuthMode = function (signup) {
      const username = document.getElementById('usernameField');
      const submit = document.getElementById('authSubmit');
      const toggle = document.getElementById('modeToggle');
      const intro = document.getElementById('authIntro');
      const password = document.getElementById('passwordInput');
      if (!username || !submit || !toggle) return;
      window.kernalsSignupMode = signup;
      username.classList.toggle('hidden', !signup);
      document.getElementById('usernameInput').required = signup;
      submit.textContent = signup ? 'Create account' : 'Sign in';
      toggle.textContent = signup ? 'I already have an account' : 'Create an account';
      intro.textContent = signup ? 'Create an account to join Kernals chat.' : 'Sign in to your Kernals account.';
      password.autocomplete = signup ? 'new-password' : 'current-password';
      document.getElementById('authStatus').textContent = '';
    };
    window.addEventListener('DOMContentLoaded', function () {
      document.getElementById('modeToggle').addEventListener('click', function () {
        window.kernalsSetAuthMode(!window.kernalsSignupMode);
      });
      window.setTimeout(function () {
        if (!window.kernalsAppStarted) {
          document.getElementById('authStatus').textContent = 'The chat script did not start. Reload this page, or open it from the GitHub Pages site (not the GitHub code page).';
          document.getElementById('authStatus').classList.add('error');
        }
      }, 7000);
    });
  </script>
  <script src="./app.js" defer></script>
</head>
<body>
  <section id="authScreen" class="shell">
    <div class="auth-card">
      <div class="brand"><span class="logo">K</span><span>Kernals</span></div>
      <p class="sub" id="authIntro">Sign in or create an account to join the chat.</p>
      <form id="authForm">
        <div class="field hidden" id="usernameField"><label for="usernameInput">Username</label><input id="usernameInput" maxlength="24" autocomplete="username" placeholder="Choose a username"></div>
        <div class="field"><label for="emailInput">Email</label><input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div class="field"><label for="passwordInput">Password</label><input id="passwordInput" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></div>
        <div class="auth-actions"><button class="text-btn" id="modeToggle" type="button">Create an account</button><button class="primary" id="authSubmit" type="submit">Sign in</button></div>
      </form>
      <div id="authStatus" class="status" aria-live="polite">Starting chat…</div>
    </div>
  </section>

  <div id="appScreen" class="app hidden">
    <div class="layout" id="layoutRoot">
      <aside class="nav" aria-label="Chat navigation">
        <div class="rail"><div class="logo rail-logo">K</div></div>
        <div class="channels">
          <div class="server-name">Kernals</div>
          <div class="cat">Channels</div><div id="channelList"></div>
          <div class="cat">Direct messages</div><div id="dmList"><div class="note">Start one with + DM.</div></div>
          <div class="userbar"><div class="user-info"><span class="avatar" id="profileAvatar">?</span><span class="name-wrap"><strong id="profileName">Not signed in</strong><small>Account</small></span></div><button class="secondary sm" id="logoutBtn" type="button">Log out</button></div>
        </div>
      </aside>
      <main class="conversation">
        <header class="chat-header">
          <button class="secondary nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation">☰</button>
          <div class="title"><span id="titlePrefix">#</span><span id="currentName">general</span></div>
          <span class="connection" id="connectionStatus" aria-live="polite">Connecting…</span>
          <button class="secondary sm" id="newDmBtn" type="button">+ DM</button>
          <button class="secondary sm" id="newChannelBtn" type="button">+ Channel</button>
        </header>
        <section id="messages" class="messages" aria-live="polite"><div class="empty">Connecting to chat…</div></section>
        <div id="typingIndicator" class="typing" aria-live="polite"></div>
        <form id="composerForm" class="composer-wrap">
          <textarea id="composer" rows="1" maxlength="2000" placeholder="Message #general" aria-label="Message"></textarea>
          <button class="primary send" id="sendBtn" type="submit" aria-label="Send message">➤</button>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
